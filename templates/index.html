<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム一覧</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .search-form {
            background-color: #ccccff;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        .search-form div {
            display: flex;
            flex-direction: column;
            margin: 5px;
        }
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #666;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
        .push-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .pushed {
            background-color: red;
            color: white;
        }
        .not-pushed {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>ゲーム一覧</h1>

    <form method="GET" action="/" class="search-form">
        <div>
            <label for="search">タイトル名</label>
            <input type="text" name="search" value="{{ search_query }}">
        </div>
        <div>
            <label for="series">シリーズ名</label>
            <input type="text" name="series" value="{{ series_query }}">
        </div>
        <div style="align-self: flex-end;">
            <button type="submit">検索</button>
        </div>
    </form>

    <table>
        <tr>
            <th>タイトル</th>
            <th>発売日</th>
            <th>ハード</th>
            <th>メーカー</th>
            <th>推し数</th>
            <th>推し</th>
        </tr>
        {% for game in games %}
        <tr>
            <td>{{ game.title }}</td>
            <td>{{ game.release_date or '不明' }}</td>
            <td>{{ game.platform or '不明' }}</td>
            <td>{{ game.developer or '不明' }}</td>
            <td>{{ game.push_count }}</td>
            <td>
                <form action="{{ url_for('push_game', game_id=game.id) }}" method="POST">
                    <button type="submit"
                            class="push-btn {% if game.pushed %}pushed{% else %}not-pushed{% endif %}">
                        {% if game.pushed %}推し解除{% else %}推す{% endif %}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
